name: Release workflow checks

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/maven-central-release.yml
      - .github/workflows/release-checks.yml
      - .github/tests/**
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/maven-central-release.yml
      - .github/workflows/release-checks.yml
      - .github/tests/**

permissions:
  contents: read

jobs:
  release-workflow-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test release policy, artifact verification and publication boundary
        run: |
          python3 -m venv "$RUNNER_TEMP/release-checks"
          "$RUNNER_TEMP/release-checks/bin/python" -m pip install --disable-pip-version-check -r .github/tests/requirements.txt
          "$RUNNER_TEMP/release-checks/bin/python" -m unittest discover -s .github/tests -v
